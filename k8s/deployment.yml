apiVersion: v1
kind: ConfigMap
metadata:
  name: cooperativa-web-content
  labels:
    app: cooperativa-web
data:
  index.html: |
    <!doctype html>
    <html lang="es">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cooperativa 15 de Abril | GitOps</title>
        <style>
          body { margin: 0; min-height: 100vh; display: grid; place-items: center;
                 background: #eef5ef; color: #123b25; font: 16px Arial, sans-serif; }
          main { max-width: 620px; margin: 24px; padding: 40px; background: white;
                 border-radius: 16px; box-shadow: 0 8px 32px #123b2520; }
          h1 { margin-top: 0; }
          .badge { display: inline-block; padding: 8px 12px; border-radius: 999px;
                   background: #d9f4e2; color: #146b38; font-weight: bold; }
        </style>
      </head>
      <body>
        <main>
          <span class="badge">Aplicación web de demostración</span>
          <h1>Cooperativa 15 de Abril</h1>
          <p>Esta página se sirve desde Kubernetes y su configuración se administra con Argo CD.</p>
          <p>Proyecto individual de despliegue GitOps. Sincronizado automáticamente desde GitHub.</p>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooperativa-web
  labels:
    app: cooperativa-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cooperativa-web
  template:
    metadata:
      labels:
        app: cooperativa-web
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: web-content
          configMap:
            name: cooperativa-web-content
