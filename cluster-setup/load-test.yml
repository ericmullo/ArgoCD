apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga-web
  namespace: gitops-demo
  labels:
    app: carga-web
spec:
  replicas: 12
  selector:
    matchLabels:
      app: carga-web
  template:
    metadata:
      labels:
        app: carga-web
    spec:
      containers:
        - name: generador
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do wget -q -O /dev/null http://cooperativa-web.gitops-demo.svc.cluster.local; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
